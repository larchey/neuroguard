name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # The threat-model suite is the reason this workflow exists. Its
      # characterisation tests assert the *current, vulnerable* behaviour of every
      # threat marked OPEN in docs/threat-catalog.json, so they are expected to fail
      # when a fix lands — that failure is the signal to update the catalogue status
      # and rewrite the test against the fixed behaviour, not a regression to revert.
      - name: Test
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

      - name: Examples still run
        run: |
          cargo run --example basic_bci
          cargo run --example attack_scenarios
